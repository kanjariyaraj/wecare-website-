name: Auto Commit Loop

on:
  schedule:
    # Run at 00:00 every day
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write # Needed to push commits back to the repository

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Ensure we fetch all history and not just a single commit,
          # otherwise subsequent pushes might face issues
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Auto Commit Script
        run: python auto_commit.py
