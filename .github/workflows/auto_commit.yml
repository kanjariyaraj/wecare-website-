name: Auto Commit Loop

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: give write permission to the workflow to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history if needed, though default is fine
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Auto Commit Script
        run: python auto_commit.py
