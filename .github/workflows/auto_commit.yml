name: Auto Commit Loop

on:
  schedule:
    # Run once every day at 12:00 UTC (noon)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need write permission to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Important: Fetch all history to ensure we are on the branch properly
          # and not in a detached HEAD state. Using a token with write access.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use a stable python version

      - name: Run Auto Commit Script
        run: python auto_commit.py