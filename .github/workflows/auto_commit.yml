name: Auto Commit

on:
  schedule:
    - cron: '0 12 * * *' # Run daily at 12:00 UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Ensure action can push back to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Ensure full history is fetched to allow proper commits
          fetch-depth: 0
          # Use GITHUB_TOKEN to push changes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run auto-commit script
        run: python auto_commit.py
