name: Auto Commit Loop

on:
  schedule:
    # Runs at 12:00 UTC every day
    - cron: '0 12 * * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Ensure we have the full history for committing and pushing
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run automated commit script
        run: python auto_commit.py
