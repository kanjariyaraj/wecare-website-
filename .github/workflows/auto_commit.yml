name: Auto Commit

on:
  schedule:
    # Run once every day at 12:00 PM UTC
    - cron: '0 12 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          # Ensure we checkout the branch where we want to push
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Auto Commit Script
        run: python auto_commit.py
        env:
          GITHUB_ACTIONS: true
