name: Auto Commit Loop

on:
  schedule:
    # Runs at 12:00 UTC every day
    - cron: '0 12 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  auto_commit:
    runs-on: ubuntu-latest

    # We need write permissions to push to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for all tags and branches
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run Auto Commit Script
        run: |
          python auto_commit.py

      - name: Push changes
        run: |
          # The script performs git commit directly, so we just need to push the changes
          # using the GITHUB_TOKEN provided by GitHub Actions
          git push
